name: Krypto Dashboard Update

on:
  schedule:
    - cron: "7 * * * *"     # jede Stunde (UTC)
  workflow_dispatch:          # Knopf "Run workflow" zum manuellen Starten
  push:
    branches: [main]
    paths: ["update.py", "requirements.txt", ".github/workflows/update.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Daten laden und Seite bauen
        run: python update.py

      - name: Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Seite hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      # GitHub findet das gerade hochgeladene Paket manchmal kurz nicht – dann nach 60 s noch einmal versuchen
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Kurz warten (nur bei Fehler)
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Veröffentlichen – zweiter Versuch
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
